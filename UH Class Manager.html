<script>
/* UH Class Manager (mock) — vanilla JS, no build step.
   State (cart + enrolled classes) is saved in localStorage. */
(function () {
  "use strict";

  // ------------------------------------------------------------------ state
  const STORE_KEY = "uh-class-manager-v1";
  const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri"];
  const COLORS = ["red", "blue", "green", "amber", "purple", "teal"];

  let state = load();
  let filters = { subject: "", number: "", keyword: "", term: CURRENT_TERM };
  let scheduleTerm = CURRENT_TERM;
  let cartStep = "review";           // "review" | "done"
  let justEnrolled = [];
  let pending = "";                  // two-click confirmation key, e.g. "drop:ART105-03"

  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(STORE_KEY));
      if (s && Array.isArray(s.cart) && Array.isArray(s.enrolled)) return s;
    } catch (e) { /* ignore */ }
    return { cart: [], enrolled: [] };
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
  }

  // ------------------------------------------------------------------ helpers
  const $ = (sel, el = document) => el.querySelector(sel);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const money = (n) => "$" + n.toLocaleString("en-US");
  const byId = (id) => COURSES.find((c) => c.id === id);
  const cartCourses = () => state.cart.map(byId).filter(Boolean);
  const enrolledCourses = () => state.enrolled.map(byId).filter(Boolean);
  const isInCart = (c) => state.cart.includes(c.id);
  const isEnrolled = (c) => state.enrolled.includes(c.id);
  const seatsLeft = (c) => c.seats - c.taken - (isEnrolled(c) ? 1 : 0);
  const tuition = (c) => c.credits * PRICE_PER_CREDIT;
  const colorFor = (c) => COLORS[COURSES.indexOf(c) % COLORS.length];

  function fmtTime(m) {
    const h = Math.floor(m / 60), mm = m % 60, ap = h >= 12 ? "PM" : "AM";
    return `${((h + 11) % 12) + 1}:${String(mm).padStart(2, "0")} ${ap}`;
  }
  const fmtRange = (c) => `${fmtTime(c.start)} – ${fmtTime(c.end)}`;
  const meeting = (c) => `${c.days.join(", ")} · ${fmtTime(c.start).replace(" ", " ")}–${fmtTime(c.end)}`;
  const where = (c) => `${c.building} · ${c.room}`;

  function overlaps(a, b) {
    return a.id !== b.id && a.term === b.term &&
      a.days.some((d) => b.days.includes(d)) && a.start < b.end && b.start < a.end;
  }
  // Conflicts among the cart and already-enrolled classes (cart-vs-cart, cart-vs-enrolled).
  function cartConflicts() {
    const cart = cartCourses(), enrolled = enrolledCourses(), out = [];
    cart.forEach((a, i) => {
      cart.slice(i + 1).forEach((b) => overlaps(a, b) && out.push([a, b]));
      enrolled.forEach((b) => overlaps(a, b) && out.push([a, b]));
    });
    return out;
  }
  const conflictIds = () => new Set(cartConflicts().flat().map((c) => c.id));

  // ------------------------------------------------------------------ icons
  const ICONS = {
    home: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
    cart: '<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a1 1 0 0 0 1 .8h8.8a1 1 0 0 0 1-.8L20 8H6"/>',
    calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    book: '<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/>',
    help: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01"/>',
    pin: '<path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
    doc: '<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',
    users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14a6.5 6.5 0 0 1 3.5 6"/>',
    trash: '<path d="M4 7h16M10 3h4M6 7l1 14h10l1-14M10 11v6M14 11v6"/>',
    left: '<path d="M19 12H5M11 6l-6 6 6 6"/>',
    right: '<path d="M5 12h14M13 6l6 6-6 6"/>',
    check: '<path d="m5 12 5 5 9-10"/>',
    plus: '<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',
    printer: '<path d="M7 9V3h10v6M7 17H4v-7h16v7h-3"/><rect x="7" y="14" width="10" height="7"/>',
    info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
    alert: '<path d="M12 3 2 20h20z"/><path d="M12 10v5M12 17.5h.01"/>',
    chev: '<path d="m6 9 6 6 6-6"/>',
  };
  const icon = (n, size = 16) =>
    `<svg class="ic" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

  // ------------------------------------------------------------------ routing
  function route() {
    const h = location.hash.replace(/^#/, "") || "dashboard";
    if (h.startsWith("class-")) return { name: "class", arg: h.slice(6) };
    return { name: h, arg: "" };
  }
  const go = (path) => { location.hash = "#" + path; };

  window.addEventListener("hashchange", () => { cartStep = "review"; pending = ""; render(); window.scrollTo(0, 0); });

  // ------------------------------------------------------------------ shell
  const NAV = [
    { id: "dashboard", label: "Student Dashboard", icon: "home" },
    { id: "find", label: "Find Classes", icon: "search" },
    { id: "cart", label: "Enrollment Cart", icon: "cart" },
    { id: "schedule", label: "My Schedule", icon: "calendar" },
  ];

  function shell(active, crumbs, body) {
    const navItem = (n) =>
      `<a class="nav-item ${active === n.id ? "active" : ""}" href="#${n.id}">${icon(n.icon, 18)}<span>${n.label}</span>` +
      (n.id === "cart" && state.cart.length ? `<span class="badge">${state.cart.length}</span>` : "") + `</a>`;
    const crumbHtml = crumbs.map((c, i) =>
      i === crumbs.length - 1 ? `<strong>${esc(c.label)}</strong>` : `<a href="#${c.to}">${esc(c.label)}</a>`
    ).join('<span class="sep">›</span>');
    return `
    <div class="layout">
      <aside class="sidebar">
        <a class="brand" href="#dashboard" aria-label="Home">
          <span class="logo">UH</span>
          <span class="brand-text"><small>University of</small><b>Houston</b></span>
        </a>
        <nav>
          <div class="nav-label">Workspace</div>
          ${NAV.map(navItem).join("")}
          <div class="nav-label">Manage</div>
          <a class="nav-item ${active === "classes" ? "active" : ""}" href="#classes">${icon("book", 18)}<span>My Classes</span></a>
        </nav>
        <div class="sidebar-bottom">
          <a class="nav-item ${active === "help" ? "active" : ""}" href="#help">${icon("help", 18)}<span>Help Center</span></a>
          <div class="user"><span class="avatar">JD</span><span><b>John Doe</b><small>Cougar ID 1046932</small></span></div>
        </div>
      </aside>
      <div class="main">
        <header class="topbar">
          <div class="crumbs">${crumbHtml}</div>
          <div class="topbar-right">
            <div class="term"><small>myUH · Current term</small><b>${CURRENT_TERM}</b></div>
            <a class="help-link" href="#help">${icon("help", 16)} Need help?</a>
          </div>
        </header>
        <main class="content">${body}</main>
      </div>
    </div>`;
  }

  // ------------------------------------------------------------------ views
  function dashboardView() {
    const enrolled = enrolledCourses();
    const credits = enrolled.reduce((s, c) => s + c.credits, 0);
    const body = `
      <h1>Welcome back, John</h1>
      <p class="sub">Here's where things stand for ${CURRENT_TERM}.</p>
      <div class="stats">
        <div class="card stat"><span>Enrolled classes</span><b>${enrolled.length}</b></div>
        <div class="card stat"><span>Enrolled credits</span><b>${credits}</b></div>
        <div class="card stat"><span>Classes in cart</span><b>${state.cart.length}</b></div>
      </div>
      <div class="card pad">
        <h2>Get started</h2>
        <p class="muted">This is a mock registration system for playing around. Nothing here is real or connected to any university system.</p>
        <div class="row gap wrap">
          <a class="btn primary" href="#find">${icon("search", 15)} Find classes</a>
          <a class="btn" href="#cart">${icon("cart", 15)} Review cart</a>
          <a class="btn" href="#schedule">${icon("calendar", 15)} View schedule</a>
        </div>
      </div>`;
    return shell("dashboard", [{ label: "Student Dashboard" }], body);
  }

  function findView() {
    const list = COURSES.filter((c) => {
      if (c.term !== filters.term) return false;
      if (filters.subject && c.subject !== filters.subject) return false;
      if (filters.number && !c.number.startsWith(filters.number.trim())) return false;
      const k = filters.keyword.trim().toLowerCase();
      if (k && !(`${c.title} ${c.instructor} ${c.description} ${c.subject} ${c.number}`.toLowerCase().includes(k))) return false;
      return true;
    });
    const opt = (v, label, sel) => `<option value="${esc(v)}" ${sel ? "selected" : ""}>${esc(label)}</option>`;
    const body = `
      <h1>Find Classes</h1>
      <p class="sub">Search for classes by subject, course number, or keyword.</p>
      <form class="filters" data-form="search">
        <label>Subject
          <select name="subject">${opt("", "All Subjects", !filters.subject)}${Object.entries(SUBJECTS).map(([k, v]) => opt(k, `${k} – ${v}`, filters.subject === k)).join("")}</select>
        </label>
        <label>Course number
          <input name="number" placeholder="e.g. 105" value="${esc(filters.number)}" inputmode="numeric">
        </label>
        <label class="grow">Keyword
          <input name="keyword" placeholder="e.g. design, marketing" value="${esc(filters.keyword)}">
        </label>
        <label>Semester
          <select name="term">${Object.keys(TERMS).map((t) => opt(t, t, filters.term === t)).join("")}</select>
        </label>
        <button class="btn primary" type="submit">${icon("search", 15)} Search Classes</button>
      </form>
      <div class="results-head"><b>Search results</b> <span class="muted">(${list.length} ${list.length === 1 ? "class" : "classes"})</span>
        ${(filters.subject || filters.number || filters.keyword) ? '<button class="link" data-action="clear-filters">Clear filters</button>' : ""}</div>
      ${list.length ? list.map(resultCard).join("") : `<div class="card pad empty">No classes match your search. Try clearing a filter.</div>`}`;
    return shell("find", [{ label: "Classes", to: "find" }, { label: "Find Classes" }], body);
  }

  function resultCard(c) {
    const left = seatsLeft(c);
    const seatTxt = left <= 0 ? `<span class="seats full">● Class full</span>` : `<span class="seats ${left <= 5 ? "low" : ""}">● Seats available: ${left}</span>`;
    let btn;
    if (isEnrolled(c)) btn = `<span class="pill ok">${icon("check", 13)} Enrolled</span>`;
    else if (isInCart(c)) btn = `<button class="btn" disabled>${icon("check", 15)} In cart</button>`;
    else if (left <= 0) btn = `<button class="btn" disabled>Full</button>`;
    else btn = `<button class="btn primary" data-action="add" data-id="${c.id}">${icon("cart", 15)} Add to cart</button>`;
    return `
      <article class="card result accent">
        <div class="tile ${colorFor(c)}">${icon("book", 20)}</div>
        <div class="result-main">
          <div class="code">${c.subject} ${c.number}</div>
          <h3>${esc(c.title)}</h3>
          <div class="muted small">Section ${c.section} · ${c.credits} credits</div>
          <div class="meta">
            <span>${icon("calendar", 13)} ${esc(meeting(c))}</span>
            <span>${icon("pin", 13)} ${esc(where(c))}</span>
            <span>${icon("user", 13)} ${esc(c.instructor)}</span>
          </div>
        </div>
        <div class="result-side">
          ${seatTxt}
          <div class="row gap">
            <a class="btn" href="#class-${c.id}">View details</a>
            ${btn}
          </div>
        </div>
      </article>`;
  }

  function detailsView(id) {
    const c = byId(id);
    if (!c) return shell("find", [{ label: "Classes", to: "find" }, { label: "Not found" }],
      `<h1>Class not found</h1><p><a class="btn" href="#find">${icon("left", 15)} Back to results</a></p>`);
    const left = seatsLeft(c);
    let action;
    if (isEnrolled(c)) action = `<span class="pill ok">${icon("check", 13)} You're enrolled in this class</span>`;
    else if (isInCart(c)) action = `<a class="btn primary" href="#cart">${icon("cart", 15)} In cart — go to cart</a>`;
    else if (left <= 0) action = `<button class="btn" disabled>Class full</button>`;
    else action = `<button class="btn primary" data-action="add" data-id="${c.id}">${icon("cart", 15)} Add to enrollment cart</button>`;
    const item = (ic, label, val, cls = "") => `<div class="detail ${cls}">${icon(ic, 18)}<div><b>${label}</b><span>${val}</span></div></div>`;
    const body = `
      <h1>${esc(c.title)}</h1>
      <p class="sub">${c.subject} ${c.number} <span class="dot">·</span> ${c.credits} credits <span class="dot">·</span> Section ${c.section} <span class="dot">·</span> ${c.term}</p>
      <div class="card pad">
        <div class="details-grid">
          ${item("calendar", "Meeting time", esc(meeting(c)))}
          ${item("user", "Instructor", esc(c.instructor))}
          ${item("pin", "Location", esc(where(c)))}
          ${item("doc", "Prerequisites", esc(c.prereq))}
          ${item("users", "Seats available", left <= 0 ? "Full (0 of " + c.seats + ")" : `${left} of ${c.seats}`, "green")}
        </div>
        <div class="about"><b>About this course</b><p>${esc(c.description)}</p></div>
        <div class="row between">
          <a class="btn" href="#find">${icon("left", 15)} Back to results</a>
          ${action}
        </div>
      </div>`;
    return shell("find", [{ label: "Classes", to: "find" }, { label: `${c.subject} ${c.number}` }], body);
  }

  function stepper(step) {
    const steps = ["Choose classes", "Review cart", "Confirmation"];
    return `<ol class="stepper">${steps.map((s, i) => {
      const n = i + 1, st = n < step ? "done" : n === step ? "current" : "todo";
      return `<li class="${st}"><span class="dotn">${st === "done" ? icon("check", 12) : n}</span>${s}</li>`;
    }).join('<li class="line" aria-hidden="true"></li>')}</ol>`;
  }

  function cartView() {
    if (cartStep === "done") return confirmationView();
    const items = cartCourses();
    const conflicts = cartConflicts();
    const bad = conflictIds();
    const full = items.filter((c) => seatsLeft(c) <= 0);
    const tu = items.reduce((s, c) => s + tuition(c), 0);
    const fee = items.length ? STUDENT_SERVICES_FEE : 0;
    const credits = items.reduce((s, c) => s + c.credits, 0);
    const blocked = conflicts.length > 0 || full.length > 0;
    const terms = [...new Set(items.map((c) => c.term))];
    const closes = terms.length ? TERMS[terms[0]].closes : TERMS[CURRENT_TERM].closes;

    const warn = [];
    conflicts.forEach(([a, b]) => warn.push(`<b>${a.subject} ${a.number}</b> overlaps with <b>${b.subject} ${b.number}</b>${isEnrolled(b) ? " (already enrolled)" : ""}. Remove one to continue.`));
    full.forEach((c) => warn.push(`<b>${c.subject} ${c.number}</b> is now full. Remove it to continue.`));

    const body = `
      <div class="row between wrap">
        <div><h1>Enrollment cart</h1><p class="sub">Review your selected classes before completing enrollment.</p></div>
        <span class="pill soft">${CURRENT_TERM} term</span>
      </div>
      ${stepper(2)}
      ${warn.length ? `<div class="alert error">${icon("alert", 18)}<div>${warn.map((w) => `<div>${w}</div>`).join("")}</div></div>` : ""}
      ${items.length ? `
      <div class="cart-grid">
        <section>
          <div class="results-head"><b>Selected classes</b> <span class="muted">${items.length} ${items.length === 1 ? "class" : "classes"} · ${credits} credits</span>
            <a class="link right" href="#find">${icon("plus", 14)} Add another class</a></div>
          ${items.map((c) => cartCard(c, bad.has(c.id))).join("")}
          <div class="alert info">${icon("info", 16)}<div><b>Classes aren't reserved yet.</b> Availability may change until you complete enrollment.</div></div>
        </section>
        <aside class="card pad summary">
          <h3>Enrollment summary</h3>
          <div class="line-item"><span>Tuition (${items.length} ${items.length === 1 ? "class" : "classes"})</span><b>${money(tu)}</b></div>
          <div class="line-item"><span>Student services fee</span><b>${money(fee)}</b></div>
          <div class="total"><span>Total due</span><b>${money(tu + fee)}<small>USD</small></b></div>
          <button class="btn primary block" data-action="enroll" ${blocked ? "disabled" : ""}>Continue to enroll ${icon("right", 15)}</button>
          <div class="alert deadline">${icon("calendar", 16)}<div><b>Enrollment closes ${closes}</b><small>Make sure to enroll before the deadline.</small></div></div>
          <button class="link danger" data-action="clear-cart">Empty cart</button>
        </aside>
      </div>` : `
      <div class="card pad empty">
        <p>Your cart is empty.</p>
        <a class="btn primary" href="#find">${icon("search", 15)} Find classes</a>
      </div>`}`;
    return shell("cart", [{ label: "Classes", to: "find" }, { label: "Enrollment cart" }], body);
  }

  function cartCard(c, conflict) {
    return `
      <article class="card result accent ${conflict ? "conflict" : ""}">
        <div class="tile ${colorFor(c)}">${icon("book", 20)}</div>
        <div class="result-main">
          <div class="code">${c.subject} ${c.number}</div>
          <h3>${esc(c.title)}</h3>
          <div class="muted small">Section ${c.section} · ${c.credits} credits · ${c.term}</div>
          <div class="meta">
            <span>${icon("calendar", 13)} ${esc(meeting(c))}</span>
            <span>${icon("pin", 13)} ${esc(where(c))}</span>
            <span>${icon("user", 13)} ${esc(c.instructor)}</span>
          </div>
        </div>
        <div class="result-side end">
          <b class="price">${money(tuition(c))}</b>
          <button class="link danger" data-action="remove" data-id="${c.id}">${icon("trash", 14)} Remove</button>
        </div>
      </article>`;
  }

  function confirmationView() {
    const items = justEnrolled.map(byId).filter(Boolean);
    const body = `
      <h1>Enrollment cart</h1>
      ${stepper(4)}
      <div class="card pad confirm">
        <span class="bigcheck">${icon("check", 28)}</span>
        <h2>You're enrolled!</h2>
        <p class="muted">${items.length} ${items.length === 1 ? "class has" : "classes have"} been added to your schedule.</p>
        <ul class="confirm-list">${items.map((c) => `<li><b>${c.subject} ${c.number}</b> ${esc(c.title)} <span class="muted">· ${esc(meeting(c))}</span></li>`).join("")}</ul>
        <div class="row gap center">
          <a class="btn primary" href="#schedule">${icon("calendar", 15)} View my schedule</a>
          <a class="btn" href="#find">${icon("search", 15)} Find more classes</a>
        </div>
      </div>`;
    return shell("cart", [{ label: "Classes", to: "find" }, { label: "Confirmation" }], body);
  }

  function scheduleView() {
    const list = enrolledCourses().filter((c) => c.term === scheduleTerm);
    const credits = list.reduce((s, c) => s + c.credits, 0);
    const H0 = 8, H1 = 18, HH = 46; // 8 AM - 6 PM, px per hour
    const hours = Array.from({ length: H1 - H0 }, (_, i) => H0 + i);
    const label = (h) => `${((h + 11) % 12) + 1}:00 ${h >= 12 ? "PM" : "AM"}`;
    const col = (d) => `<div class="cal-col" style="height:${(H1 - H0) * HH}px">${list.filter((c) => c.days.includes(d)).map((c) =>
      `<a class="event ${colorFor(c)}" href="#class-${c.id}" style="top:${((c.start - H0 * 60) / 60) * HH}px;height:${((c.end - c.start) / 60) * HH - 2}px" title="${esc(c.title)}">
         <b>${c.subject} ${c.number}</b><span>${fmtTime(c.start).replace(" ", "")} – ${fmtTime(c.end).replace(" ", "")}</span><span class="ev-where">${esc(c.room)}</span></a>`).join("")}</div>`;
    const body = `
      <div class="row between wrap gap">
        <div><h1>My Schedule</h1><p class="sub">View your enrolled classes for the selected semester.</p></div>
        <div class="row gap end-align wrap no-print">
          <label class="inline">Semester
            <select data-change="schedule-term">${Object.keys(TERMS).map((t) => `<option ${t === scheduleTerm ? "selected" : ""}>${t}</option>`).join("")}</select>
          </label>
          <a class="btn primary" href="#find">${icon("search", 15)} Find more classes</a>
        </div>
      </div>
      <div class="card pad cal-card">
        <div class="cal-title">${icon("calendar", 15)} <b>${TERMS[scheduleTerm].week}</b></div>
        <div class="cal">
          <div class="cal-head"><span></span>${DAYS.map((d) => `<span>${d === "Mon" ? "Monday" : d === "Tue" ? "Tuesday" : d === "Wed" ? "Wednesday" : d === "Thu" ? "Thursday" : "Friday"}</span>`).join("")}</div>
          <div class="cal-body">
            <div class="cal-hours">${hours.map((h) => `<span style="height:${HH}px">${label(h)}</span>`).join("")}</div>
            <div class="cal-grid" style="--hh:${HH}px">${DAYS.map(col).join("")}</div>
          </div>
        </div>
        ${list.length ? "" : `<p class="muted center-text">No enrolled classes for ${scheduleTerm}. <a href="#find">Find some</a>.</p>`}
      </div>
      <div class="card pad">
        <div class="row between"><h2>Enrolled classes (${list.length})</h2><span class="muted small">Total credits: ${credits}</span></div>
        ${list.length ? `<div class="table-wrap"><table>
          <thead><tr><th>Course</th><th>Title</th><th>Section</th><th>Credits</th><th>Meeting time</th><th>Location</th><th class="no-print"></th></tr></thead>
          <tbody>${list.map((c) => `<tr>
            <td><span class="swatch ${colorFor(c)}"></span>${c.subject} ${c.number}</td><td>${esc(c.title)}</td><td>${c.section}</td><td>${c.credits}</td>
            <td>${esc(meeting(c))}</td><td>${esc(where(c))}</td>
            <td class="no-print"><button class="link danger" data-action="drop" data-id="${c.id}">${pending === "drop:" + c.id ? "Confirm drop?" : "Drop"}</button></td></tr>`).join("")}</tbody>
        </table></div>` : `<p class="muted">Nothing here yet.</p>`}
      </div>`;
    return shell("schedule", [{ label: "Classes", to: "find" }, { label: "My Schedule" }], body);
  }

  function classesView() {
    const list = enrolledCourses();
    const body = `
      <h1>My Classes</h1>
      <p class="sub">Everything you're currently enrolled in, across all terms.</p>
      ${list.length ? list.map((c) => `
        <article class="card result accent">
          <div class="tile ${colorFor(c)}">${icon("book", 20)}</div>
          <div class="result-main">
            <div class="code">${c.subject} ${c.number} · ${c.term}</div>
            <h3>${esc(c.title)}</h3>
            <div class="muted small">Section ${c.section} · ${c.credits} credits</div>
            <div class="meta"><span>${icon("calendar", 13)} ${esc(meeting(c))}</span><span>${icon("pin", 13)} ${esc(where(c))}</span><span>${icon("user", 13)} ${esc(c.instructor)}</span></div>
          </div>
          <div class="result-side end"><a class="btn" href="#class-${c.id}">View details</a><button class="link danger" data-action="drop" data-id="${c.id}">${icon("trash", 14)} ${pending === "drop:" + c.id ? "Click again to confirm" : "Drop class"}</button></div>
        </article>`).join("") : `<div class="card pad empty"><p>You're not enrolled in any classes yet.</p><a class="btn primary" href="#find">${icon("search", 15)} Find classes</a></div>`}`;
    return shell("classes", [{ label: "My Classes" }], body);
  }

  function helpView() {
    const body = `
      <h1>Help Center</h1>
      <p class="sub">How this demo works.</p>
      <div class="card pad prose">
        <ol>
          <li><b>Find Classes</b> – filter by subject, number, keyword or semester, then add classes to your cart.</li>
          <li><b>Enrollment Cart</b> – review costs. Classes with overlapping meeting times are flagged and block enrollment (try MATH 140 with ART 105).</li>
          <li><b>Enroll</b> – seats are reduced when you enroll; full classes can't be added.</li>
          <li><b>My Schedule</b> – see your week, switch semesters, print, or drop a class.</li>
        </ol>
        <p class="muted">Everything is saved in your browser's local storage. This is an unofficial mockup, not affiliated with any university.</p>
        <button class="btn danger" data-action="reset">${pending === "reset:" ? "Click again to reset" : "Reset demo data"}</button>
      </div>`;
    return shell("help", [{ label: "Help Center" }], body);
  }

  // ------------------------------------------------------------------ render
  function render() {
    const { name, arg } = route();
    const views = { dashboard: dashboardView, find: findView, class: () => detailsView(arg), cart: cartView, schedule: scheduleView, classes: classesView, help: helpView };
    $("#app").innerHTML = (views[name] || dashboardView)();
  }

  // ------------------------------------------------------------------ toasts
  function toast(msg, kind = "") {
    const el = document.createElement("div");
    el.className = "toast " + kind;
    el.textContent = msg;
    $("#toasts").appendChild(el);
    setTimeout(() => el.classList.add("out"), 2600);
    setTimeout(() => el.remove(), 3000);
  }

  // ------------------------------------------------------------------ events
  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-action]");
    const key = t ? t.dataset.action + ":" + (t.dataset.id || "") : "";
    if (pending && pending !== key) { pending = ""; render(); }
    if (!t) return;
    const id = t.dataset.id, c = id && byId(id);
    switch (t.dataset.action) {
      case "add":
        if (c && !isInCart(c) && !isEnrolled(c) && seatsLeft(c) > 0) {
          state.cart.push(c.id); save(); render();
          const clash = cartConflicts().some((p) => p.includes(c));
          toast(clash ? `${c.subject} ${c.number} added — but it conflicts with another class` : `${c.subject} ${c.number} added to cart`, clash ? "warn" : "ok");
        }
        break;
      case "remove":
        state.cart = state.cart.filter((x) => x !== id); save(); render(); toast("Removed from cart");
        break;
      case "clear-cart":
        state.cart = []; save(); render(); toast("Cart emptied");
        break;
      case "enroll": {
        if (cartConflicts().length || cartCourses().some((x) => seatsLeft(x) <= 0)) return;
        justEnrolled = [...state.cart];
        state.enrolled.push(...state.cart); state.cart = []; save();
        cartStep = "done"; render(); window.scrollTo(0, 0);
        break;
      }
      case "drop":
        if (!c) break;
        if (pending !== key) { pending = key; render(); break; }
        pending = ""; state.enrolled = state.enrolled.filter((x) => x !== id); save(); render(); toast(`${c.subject} ${c.number} dropped`);
        break;
      case "clear-filters":
        filters = { subject: "", number: "", keyword: "", term: filters.term }; render();
        break;
      case "reset":
        if (pending !== key) { pending = key; render(); break; }
        pending = ""; state = { cart: [], enrolled: [] }; save(); toast("Demo reset", "ok"); go("dashboard"); render();
        break;
    }
  });

  document.addEventListener("submit", (e) => {
    if (e.target.dataset.form !== "search") return;
    e.preventDefault();
    const f = new FormData(e.target);
    filters = { subject: f.get("subject"), number: f.get("number"), keyword: f.get("keyword"), term: f.get("term") };
    render();
  });

  document.addEventListener("change", (e) => {
    if (e.target.dataset.change === "schedule-term") { scheduleTerm = e.target.value; render(); }
  });

  render();
})();

</script>

</body></html>
